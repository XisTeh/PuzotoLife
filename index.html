<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puzoto Life — Controle de Trabalho e Finanças</title>
  <meta name="description" content="Seu espaço pessoal para organizar trabalho e finanças." />
  <link rel="icon" type="image/png" href="/images/puzoto-192.png" />
  <link rel="alternate icon" type="image/x-icon" href="/images/PuzotoLife.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/puzoto-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/src/styles/index.css" />
  <meta name="theme-color" content="#11131f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Puzoto Life" />
  <link rel="stylesheet" href="/src/styles/modern.css" />
</head>
<body>
  <a class="skip-link" href="#pageContent">Pular para o conteúdo</a>
  <div id="sessionPanel" class="session-panel">
    <section class="puzoto-launch" role="status" aria-label="Preparando o Puzoto Life">
      <div class="puzoto-launch__atmosphere" aria-hidden="true"></div>
      <div class="puzoto-launch__mark" aria-hidden="true">
        <img src="/images/PuzotoLifeBlue.png" alt="" width="96" height="96" />
      </div>
      <div class="puzoto-launch__wordmark">Puzoto <span>Life</span></div>
      <p>Seu trabalho e suas finanças, no seu ritmo.</p>
      <div class="puzoto-launch__progress" aria-hidden="true"><span></span></div>
      <span class="sr-only">Preparando seu espaço…</span>
    </section>
  </div>
  <div id="app" class="app-layout" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content" id="mainContent">
      <header class="top-header" id="topHeader"></header>
      <div class="page-content" id="pageContent" tabindex="-1"></div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
